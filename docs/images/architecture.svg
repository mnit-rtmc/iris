<svg xmlns='http://www.w3.org/2000/svg' version='1.1'
     width='640' height='480'>
<title>System Architecture</title>
<defs>
  <marker id="Arrow1Mend" orient="auto" style="overflow:visible">
    <path d="M 0,0 5,-5 -12.5,0 5,5 0,0 z"
          transform="matrix(-0.4,0,0,-0.4,-4,0)"
          style="fill:white;stroke:white;stroke-width:1pt;marker-start:none"/>
  </marker>
</defs>
<g style='font-family:sans-serif'>
  <g transform="translate(48,64)">
    <text style="font-size:x-large;fill:white">
      <tspan>IRIS System</tspan>
      <tspan x="0" y="34">Architecture</tspan>
    </text>
  </g>
  <g transform="translate(212,24)">
    <g style="fill:#ff9999;stroke:white;stroke-width:2">
      <g style="opacity:0.5">
        <rect x="16" y="16" width="160" height="88" ry="8"
              style="opacity:0.5"/>
        <rect x="8" y="8" width="160" height="88" ry="8"/>
      </g>
      <rect x="0" y="0" width="160" height="88" ry="8"/>
    </g>
    <text>
      <tspan x="48" y="48">Java Clients</tspan>
    </text>
  </g>
  <g transform="translate(420,24)">
    <g style="fill:#c4f9ff;stroke:white;stroke-width:2">
      <g style="opacity:0.5">
        <rect x="16" y="16" width="160" height="88" ry="8"
              style="opacity:0.5"/>
        <rect x="8" y="8" width="160" height="88" ry="8"/>
      </g>
      <rect x="0" y="0" width="160" height="88" ry="8"/>
    </g>
    <text>
      <tspan x="48" y="48">Web Clients</tspan>
    </text>
  </g>
  <g transform="translate(16,188)">
    <rect x="0" y="0" width="120" height="108" ry="8"
      style="fill:#d0ffc4;stroke:white;stroke-width:2"/>
    <text>
      <tspan x="16" y="40">Authentication</tspan>
      <tspan x="16" y="60">Server (LDAP)</tspan>
      <tspan x="32" y="80" style="font-style:italic">(Optional)</tspan>
    </text>
  </g>
  <g transform="translate(180,176)">
    <rect x="0" y="0" width="120" height="120" ry="8"
          style="fill:#e2c4ff;stroke:white;stroke-width:2"/>
    <text>
      <tspan x="32" y="60">Java Server</tspan>
    </text>
  </g>
  <g transform="translate(340,188)">
    <rect x="0" y="0" width="120" height="108" ry="8"
      style="fill:#f6ffc4;stroke:white;stroke-width:2" />
    <text>
      <tspan x="10" y="30">Honeybee</tspan>
      <tspan x="16" y="50">- SSE connection</tspan>
      <tspan x="16" y="70">- JSON files</tspan>
      <tspan x="16" y="90">- Device Layers</tspan>
    </text>
  </g>
  <g transform="translate(500,176)">
    <rect x="0" y="0" width="110" height="120" ry="8"
      style="fill:#ffe6c4;stroke:white;stroke-width:2"/>
    <text>
      <tspan x="10" y="32">Nginx Server</tspan>
      <tspan x="16" y="52">- Client JARs</tspan>
      <tspan x="16" y="72">- Web Client</tspan>
      <tspan x="16" y="92">- Map Tiles</tspan>
    </text>
  </g>
  <g transform="translate(40,360)">
    <g style="fill:#f6ffc4;stroke:white;stroke-width:2">
      <g style="opacity:0.5">
        <rect x="16" y="16" width="180" height="88" ry="8"
              style="opacity:0.5"/>
        <rect x="8" y="8" width="180" height="88" ry="8"/>
      </g>
      <rect x="0" y="0" width="180" height="88" ry="8"/>
    </g>
    <text>
      <tspan x="16" y="40">Traffic Monitoring</tspan>
      <tspan x="16" y="60">and Control Devices</tspan>
    </text>
  </g>
  <g transform="translate(270,360)">
    <rect x="0" y="0" width="152" height="88" ry="8"
      style="fill:#c4d1ff;stroke:white;stroke-width:2" />
    <text>
      <tspan x="16" y="40">Database</tspan>
      <tspan x="16" y="60">(PostgreSQL)</tspan>
    </text>
  </g>
  <g transform="translate(470,360)">
    <rect x="0" y="0" width="120" height="88" ry="8"
      style="fill:#ffd1ff;stroke:white;stroke-width:2" />
    <text>
      <tspan x="16" y="40">Wyrmcast</tspan>
      <tspan x="16" y="60">(Map Tiles)</tspan>
    </text>
  </g>
  <g style="stroke:white;stroke-width:2;marker-end:url(#Arrow1Mend)">
    <path d="m 280,112 -32,64"/>
    <path d="m 320,112 180,64"/>
    <path d="m 500,112 40,64"/>
    <path d="m 180,240 -40,8"/>
    <path d="m 340,250 -40,-8"/>
    <path d="m 500,240 -40,8"/>
    <path d="m 200,296 -32,64"/>
    <path d="m 290,296 32,64"/>
    <path d="m 400,296 -32,64"/>
    <path d="m 550,296 -32,64" style="stroke-dasharray:4,2"/>
  </g>
</g>
</svg>
