<!DOCTYPE html>
<html>
  <head>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">IRIS</title>
    <link rel="icon" type="image/png" href="bulb/favicon.png">
    <link rel='stylesheet'
          href='https://fonts.googleapis.com/css?family=Overpass'>
    <script type="module">
      import init from './bulb/bulb.js';
      init();
    </script>
    <link rel="stylesheet" href="bulb/bulb.css">
    <link rel="stylesheet" href="bulb/wyrm.css">
    <style id="osm-style">.wyrm-osm { display: none; }</style>
    <style id="segment-style">.wyrm-segment { display: none; }</style>
    <style id="controller-style">.wyrm-controller { display: none; }</style>
    <style id="tag_reader-style">.wyrm-tag_reader { display: none; }</style>
    <style id="weather_sensor-style">.wyrm-weather_sensor { display: none; }</style>
    <style id="beacon-style">.wyrm-beacon { display: none; }</style>
    <style id="gate_arm-style">.wyrm-gate_arm { display: none; }</style>
    <style id="ramp_meter-style">.wyrm-ramp_meter { display: none; }</style>
    <style id="camera-style">.wyrm-camera { display: none; }</style>
    <style id="lcs-style">.wyrm-lcs { display: none; }</style>
    <style id="dms-style">.wyrm-dms { display: none; }</style>
    <style id="incident-style">.wyrm-incident { display: none; }</style>
    <style id="marker-style"></style>
    <style id="selected-style"></style>
    <style id="context-style"></style>
    <style id="wyrm-anim-style"></style>
  </head>
  <body draggable="false">
    <div class="no-display">
      <svg>
        <defs>
          <path id="controller-marker" d="M0 0 L24 0 24 14 0 14z M7 4 L17 4 17 2 7 2z M7 8 L9 8 9 6 7 6z M11 8 13 8 13 6 11 6z M15 8 L17 8 17 6 15 6z M7 12 L9 12 9 10 7 10z M11 12 13 12 13 10 11 10z M15 12 L17 12 17 10 15 10z" />
          <path id="tag_reader-marker" d="M0 -6 L-6 0 A8,8 0 0 0 6 0z M-8 2 A10,10 0 0 0 8 2 L7 1 A9,9 0 0 1 -7 1z M-10 4 A12,12 0 0 0 10 4 L9 3 A11,11 0 0 1 -9 3z M-12 6 A14,14 0 0 0 12 6 L11 5 A13,13 0 0 1 -11 5z" />
          <path id="weather_sensor-marker" d="M-10 -10 L15 -5 10 0 15 5 -10 10z" />
          <path id="beacon-marker" d="M0 -16 L4 -9 12 -12 9 -4 16 0 9 4 12 12 4 9 0 20 -4 9 -12 12 -9 4 -16 0 -9 -4 -12 -12 -4 -9z" />
          <path id="gate_arm-marker" d="M0 0 L10 -8 10 -10 0 -2 -4 -2 -4 8 0 8z" />
          <path id="ramp_meter-marker" d="M0 0 L0 8 A8 8 0 1 0 8 0 L0 0z L8 8" />
          <path id="camera-marker" d="M0 6 L7 2 10 2 10 6 28 6 28 -6 10 -6 10 -2 7 -2 0 -6z" />
          <path id="lcs-marker" d="M0 0 L10 0 10 10 0 10z M12 0 L22 0 22 10 12 10z" />
          <path id="dms-marker" d="M0 0 L25 0 25 -5 20 -5 20 -15 15 -15 15 -5 10 -5 10 -15 5 -15 5 -5 0 -5z" />
          <path id="incident-marker" d="M10 0 L20 6 10 -16 0 6z" />
        </defs>
      </svg>
    </div>
    <div id="map-pane"></div>
    <div id="map-menu" class="no-display"></div>
    <div id="layer-zoom">
      <button popovertarget="layer-popover">🞁 Layers</button>
    </div>
    <div id="layer-popover" popover>
      <menu id="layer-menu">
        <li>
          <label id="current-zoom">10</label>
          <label>Current Zoom</label>
        </li>
        <li class="menu-incident">
          <input id="incident-zoom" type="number" value="10" min="6" max="18">
          <label for="incident-zoom">🚨 Incident</label>
        </li>
        <li class="menu-dms">
          <input id="dms-zoom" type="number" value="11" min="6" max="18">
          <label for="dms-zoom">⬛ DMS</label>
        </li>
        <li class="menu-lcs">
          <input id="lcs-zoom" type="number" value="14" min="6" max="18">
          <label for="lcs-zoom">⬇️ LCS</label>
        </li>
        <li class="menu-camera">
          <input id="camera-zoom" type="number" value="13" min="6" max="18">
          <label for="camera-zoom">🎥 Camera</label>
        </li>
        <li class="menu-ramp_meter">
          <input id="ramp_meter-zoom" type="number" value="15" min="6" max="18">
          <label for="ramp_meter-zoom">🚦 Ramp Meter</label>
        </li>
        <li class="menu-gate_arm">
          <input id="gate_arm-zoom" type="number" value="15" min="6" max="18">
          <label for="gate_arm-zoom">⫬ Gate Arm</label>
        </li>
        <li class="menu-beacon">
          <input id="beacon-zoom" type="number" value="14" min="6" max="18">
          <label for="beacon-zoom">🔆 Beacon</label>
        </li>
        <li class="menu-weather_sensor">
          <input id="weather_sensor-zoom" type="number" value="12" min="6" max="18">
          <label for="weather_sensor-zoom">🌦️ Weather Sensor</label>
        </li>
        <li class="menu-tag_reader">
          <input id="tag_reader-zoom" type="number" value="15" min="6" max="18">
          <label for="tag_reader-zoom">🏷️ Tag Reader</label>
        </li>
        <li class="menu-controller">
          <input id="controller-zoom" type="number" value="16" min="6" max="18">
          <label for="controller-zoom">🎛️ Controller</label>
        </li>
        <li class="menu-osm">
          <input id="osm-zoom" type="number" value="6" min="6" max="18">
          <label for="osm-zoom">© <a href="https://www.openstreetmap.org/" target="_blank" rel="noopener noreferrer">OpenStreetMap</a></label>
        </li>
      </menu>
    </div>
    <div id="side-pane">
      <div id="sidebar">
        <div class="sb_row">
          <label for="sb-resource">Resource</label>
          <select id="sb-resource">
            <option></option>
            <option id="opt-action_plan" class="no-display" value="action_plan">📋 Action Plan</option>
            <option id="opt-beacon" class="no-display" value="beacon">🔆 Beacon</option>
            <option id="opt-camera" class="no-display" value="camera">🎥 Camera</option>
            <option id="opt-dms" class="no-display" value="dms">⬛ DMS</option>
            <option id="opt-gate_arm" class="no-display" value="gate_arm">⫬ Gate Arm</option>
            <option id="opt-incident" class="no-display" value="incident">🚨 Incident</option>
            <option id="opt-lcs" class="no-display" value="lcs">⬇️ LCS</option>
            <option id="opt-ramp_meter" class="no-display" value="ramp_meter">🚦 Ramp Meter</option>
            <option id="opt-video_monitor" class="no-display" value="video_monitor">📺 Video</option>
            <option id="opt-weather_sensor" class="no-display" value="weather_sensor">🌦️ Weather</option>
            <option disabled>────────</option>
            <option id="opt-comm_config" class="no-display" value="comm_config">📡 Comm</option>
            <option id="opt-road" class="no-display" value="road">🛣️ Road</option>
            <option id="opt-permission" class="no-display" value="permission">🗝️ Permission</option>
            <option id="opt-system_attribute" class="no-display" value="system_attribute">📃 System</option>
            <option id="opt-toll_zone" class="no-display" value="toll_zone">💲 Tolling</option>
          </select>
          <label id="sb-monitor" class="sb_label">📺</label>
          <label id="sb-notify" class="sb_label">⚪</label>
          <button id="sb-logout" aria-label="Logout">👋</button>
          <input id="sb-fullscreen" class="toggle" type="checkbox" aria-label="Toggle fullscreen">
          <label for="sb-fullscreen"> ⛶ </label>
        </div>
        <div id="row-action_plan" class="no-display">
          <input id="res-action_plan" class="toggle" type="radio" name="rdo-plan" checked>
          <label for="res-action_plan">📋 Plan</label>
          <input id="res-plan_phase" class="toggle" type="radio" name="rdo-plan">
          <label for="res-plan_phase">🌘 Phase</label>
          <input id="res-day_plan" class="toggle" type="radio" name="rdo-plan">
          <label for="res-day_plan">🗓️ Day</label>
          <input id="res-device_action" class="toggle" type="radio" name="rdo-plan">
          <label for="res-device_action">🔩 Device</label>
        </div>
        <div id="row-camera" class="no-display">
          <input id="res-camera" class="toggle" type="radio" name="rdo-cam" checked>
          <label for="res-camera">🎥 Camera</label>
          <input id="res-encoder_type" class="toggle" type="radio" name="rdo-cam">
          <label for="res-encoder_type">📀 Encoder Type</label>
        </div>
        <div id="row-dms" class="no-display">
          <input id="res-dms" class="toggle" type="radio" name="rdo-dms" checked>
          <label for="res-dms">⬛&nbsp;DMS</label>
          <input id="res-msg_pattern" class="toggle" type="radio" name="rdo-dms">
          <label for="res-msg_pattern">📑&nbsp;Pattern</label>
          <input id="res-msg_line" class="toggle" type="radio" name="rdo-dms">
          <label for="res-msg_line">💬&nbsp;Line</label>
          <input id="res-sign_config" class="toggle" type="radio" name="rdo-dms">
          <label for="res-sign_config">📐&nbsp;Config</label>
          <input id="res-word" class="toggle" type="radio" name="rdo-dms">
          <label for="res-word">🔠&nbsp;Word</label>
        </div>
        <div id="row-lcs" class="no-display">
          <input id="res-lcs" class="toggle" type="radio" name="rdo-lcs" checked>
          <label for="res-lcs">⬇️ LCS</label>
          <input id="res-lcs_state" class="toggle" type="radio" name="rdo-lcs">
          <label for="res-lcs_state">🠟 State</label>
        </div>
        <div id="row-video_monitor" class="no-display">
          <input id="res-video_monitor" class="toggle" type="radio" name="rdo-vid" checked>
          <label for="res-video_monitor">📺 Monitor</label>
          <input id="res-monitor_style" class="toggle" type="radio" name="rdo-vid">
          <label for="res-monitor_style">🖵 Style</label>
<!--      <input id="res-flow_stream" class="toggle" type="radio" name="rdo-vid">
          <label for="res-flow_stream">🎞️ Stream</label> -->
        </div>
        <div id="row-comm_config" class="no-display">
          <input id="res-comm_link" class="toggle" type="radio" name="rdo-comm" checked>
          <label for="res-comm_link">🔗 Link</label>
          <input id="res-controller" class="toggle" type="radio" name="rdo-comm">
          <label for="res-controller">🎛️ Controller</label>
          <input id="res-comm_config" class="toggle" type="radio" name="rdo-comm">
          <label for="res-comm_config">📡 Config</label>
          <input id="res-alarm" class="toggle" type="radio" name="rdo-comm">
          <label for="res-alarm">📢 Alarm</label>
          <input id="res-gps" class="toggle" type="radio" name="rdo-comm">
          <label for="res-gps">🌐 GPS</label>
        </div>
        <div id="row-road" class="no-display">
          <input id="res-road" class="toggle" type="radio" name="rdo-road" checked>
          <label for="res-road">🛣️ Road</label>
          <input id="res-r_node" class="toggle" type="radio" name="rdo-road">
          <label for="res-r_node">⍿ Rnode</label>
          <input id="res-detector" class="toggle" type="radio" name="rdo-road">
          <label for="res-detector">🚗⬚ Detector</label>
          <input id="res-map_extent" class="toggle" type="radio" name="rdo-road">
          <label for="res-map_extent">🗺️ Map Extent</label>
        </div>
        <div id="row-permission" class="no-display">
          <input id="res-user_id" class="toggle" type="radio" name="rdo-perm" checked>
          <label for="res-user_id">👤 User</label>
          <input id="res-role" class="toggle" type="radio" name="rdo-perm">
          <label for="res-role">💪 Role</label>
          <input id="res-domain" class="toggle" type="radio" name="rdo-perm">
          <label for="res-domain">🖧 Domain</label>
        </div>
        <div id="row-system_attribute" class="no-display">
          <input id="res-system_attribute" class="toggle" type="radio" name="rdo-sys" checked>
          <label for="res-system_attribute">📃 Attribute</label>
          <input id="res-event_config" class="toggle" type="radio" name="rdo-sys">
          <label for="res-event_config">📜 Event</label>
          <input id="res-cabinet_style" class="toggle" type="radio" name="rdo-sys">
          <label for="res-cabinet_style">🗄️ Cabinet</label>
        </div>
        <div id="row-toll_zone" class="no-display">
          <input id="res-toll_zone" class="toggle" type="radio" name="rdo-toll">
          <label for="res-toll_zone">💲 Toll Zone</label>
          <input id="res-tag_reader" class="toggle" type="radio" name="rdo-toll" checked>
          <label for="res-tag_reader">🏷️ Tag Reader</label>
        </div>
        <div class="sb_row">
          <input id="sb-search" type="search" placeholder="🔍" size="16">
          <select id="sb-state" aria-label="State"></select>
          <button id="sb-add" type="button">➕</button>
        </div>
        <div id="sb-cards"></div>
        <div id="sb-toast" class="hidden"></div>
        <div id="sb-auth" class="hidden">
          <div class="form">
            <div class="row center">
              <img src="bulb/iris.svg">
            </div>
            <div class="row end">
              <span>IRIS authentication required</span>
            </div>
            <div class="row end">
              <label for="login_user">User name</label>
              <input id="login_user" type="text" name="username" autocomplete="username" required>
            </div>
            <div class="row end">
              <label for="login_pass">Password</label>
              <div style="position: relative;">
                <input id="login_pass" type="password" name="password" autocomplete="current-password" required>
                <div id="login_loading_bar" class="loading_bar"></div>
              </div>
            </div>
            <div class="row end">
              <button id="sb-login" type="button">Login</button>
            </div>
          </div>
          <div id="sb-shade"></div>
        </div>
      </div>
      <div id="divider">
          <button id="hide_sidebar" type="button">🞂</button>
          <button id="show_sidebar" type="button" disabled>🞀</button>
      </div>
    </div>
  </body>
</html>
